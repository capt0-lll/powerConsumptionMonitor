name: Claude

on:
  # Automatic review of every pull request
  pull_request:
    types: [opened, synchronize, reopened]
  # Ask Claude with "@claude ..." in comments
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request for an STM32F302 embedded C/C++ project
            (INA228 power monitor, UART, ring buffer, flash calibration).
            Focus on correctness, interrupt safety, buffer overflows,
            integer overflow and unit mistakes, and consistency with
            Docs/Architecture.md. Be concise and comment only on real issues.

  assistant:
    if: >
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
      && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
